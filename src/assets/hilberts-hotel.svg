<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <style>
      .ink{fill:#2b2033}.line{stroke:#2b2033;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <circle cx="200" cy="205" r="170" fill="#ffefe6"/>
  <g fill="#ff7a59" opacity=".85">
    <circle cx="70" cy="110" r="5"/><circle cx="330" cy="80" r="4"/><circle cx="345" cy="290" r="5"/><circle cx="55" cy="280" r="4"/>
  </g>
  <g fill="#2b2033"><circle cx="100" cy="60" r="4"/><circle cx="300" cy="330" r="4"/></g>
  <path d="M60 350 H340" class="line" fill="none"/>
  <!-- building -->
  <rect x="80" y="150" width="240" height="200" rx="10" fill="#fff" class="line"/>
  <rect x="80" y="150" width="240" height="30" rx="10" fill="#60c2e8" class="line"/>
  <!-- sign -->
  <rect x="120" y="95" width="160" height="50" rx="14" fill="#ff7a59" class="line"/>
  <path d="M135 120 C135 105 160 105 170 120 C180 135 205 135 205 120 C205 105 180 105 170 120 C160 135 135 135 135 120 Z" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
  <text x="248" y="128" font-family="Nunito, Arial, sans-serif" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">HOTEL</text>
  <!-- windows row -->
  <g fill="#ffd8c7" class="line">
    <rect x="98" y="200" width="36" height="36" rx="6"/><rect x="150" y="200" width="36" height="36" rx="6"/>
    <rect x="214" y="200" width="36" height="36" rx="6"/><rect x="266" y="200" width="36" height="36" rx="6"/>
  </g>
  <!-- doors -->
  <g class="line">
    <rect x="98" y="270" width="40" height="80" rx="6" fill="#ff7a59"/>
    <rect x="150" y="270" width="40" height="80" rx="6" fill="#ffb59f"/>
    <rect x="210" y="270" width="40" height="80" rx="6" fill="#60c2e8"/>
    <rect x="262" y="270" width="40" height="80" rx="6" fill="#ffd8c7"/>
  </g>
  <g fill="#2b2033">
    <circle cx="128" cy="312" r="4"/><circle cx="180" cy="312" r="4"/><circle cx="240" cy="312" r="4"/><circle cx="292" cy="312" r="4"/>
    <text x="118" y="262" font-family="Nunito, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle">1</text>
    <text x="170" y="262" font-family="Nunito, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle">2</text>
    <text x="230" y="262" font-family="Nunito, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle">3</text>
    <text x="282" y="262" font-family="Nunito, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle">…</text>
  </g>
  <!-- "no vacancy" plaque -->
  <rect x="150" y="40" width="100" height="34" rx="10" fill="#2b2033"/>
  <text x="200" y="63" font-family="Nunito, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">NO VACANCY</text>
  <path d="M200 74 V95" class="line" fill="none"/>
</svg>
